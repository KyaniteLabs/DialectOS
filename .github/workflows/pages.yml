name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # Ensure GNU tar is available as 'gtar' (required by upload-pages-artifact)
      - name: Ensure gtar is available
        run: |
          if command -v gtar &> /dev/null; then
            echo "gtar already available"
            gtar --version | head -n 1
          elif command -v brew &> /dev/null; then
            echo "macOS runner detected — installing GNU tar via coreutils"
            brew install coreutils
            echo "Installed gtar:"
            gtar --version | head -n 1
          else
            echo "Creating gtar symlink to GNU tar"
            sudo ln -sf "$(command -v tar)" /usr/local/bin/gtar
            gtar --version | head -n 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Smoke deployed Pages site
        run: |
          # No fallback: a redirect or a different site is a failed deploy.
          node scripts/smoke-pages.mjs "${{ steps.deployment.outputs.page_url }}"
