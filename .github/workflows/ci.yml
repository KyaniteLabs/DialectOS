name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Run npm audit
        run: pnpm audit --audit-level=moderate

      - name: Verify npm package contents
        run: |
          for pkg in packages/*; do
            [ -f "$pkg/package.json" ] || continue
            name="$(basename "$pkg")"
            if ! (cd "$pkg" && npm pack --dry-run) >/tmp/"$name"-pack.txt 2>&1; then
              echo "::error::npm pack failed for $pkg"
              cat /tmp/"$name"-pack.txt
              exit 1
            fi
            if grep -E 'src/__tests__|src/.*\.test\.ts|fixtures/' /tmp/"$name"-pack.txt; then
              echo "::error::Unexpected test/source fixture content in package $pkg"
              cat /tmp/"$name"-pack.txt
              exit 1
            fi
          done

      - run: pnpm test

      - name: Run coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.node-version == 22
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
          retention-days: 14

  adversarial-ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: build-and-test
    strategy:
      matrix:
        node-version: [22, 24]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Run adversarial fixture corpus
        run: pnpm --filter=@dialectos/cli test:adversarial

  hermes-plugin-tests:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # Real loader/validator, not the unit-test sys.modules stubs. Pin the
      # declared minimum runtime; this never installs into a gateway profile.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: NousResearch/hermes-agent
          ref: f27cdbce5ab63eafe8633b293a75151409da5769 # v0.21.6
          path: .hermes-test-runtime
          persist-credentials: false

      - name: Hermes dialectos plugin regressions (Python)
        run: |
          python3 -m venv "$RUNNER_TEMP/dialectos-hermes-venv"
          "$RUNNER_TEMP/dialectos-hermes-venv/bin/pip" install --quiet "pytest==8.4.2" "PyYAML==6.0.3" "packaging==26.0" "python-dotenv==1.2.2" "rich==14.3.3" "ruamel.yaml==0.18.16" "httpx==0.28.1" "requests==2.33.0" "fastapi==0.162.0"
          "$RUNNER_TEMP/dialectos-hermes-venv/bin/python" -m pytest plugins/dialectos-hermes/tests -q

      - name: Minimum runtime registration and native validator (offline)
        env:
          HERMES_HOME: ${{ runner.temp }}/dialectos-disposable-profile
          PYTHONPATH: ${{ github.workspace }}/.hermes-test-runtime
        run: |
          "$RUNNER_TEMP/dialectos-hermes-venv/bin/python" plugins/dialectos-hermes/tests/smoke/runtime_smoke.py "$PYTHONPATH" "$HERMES_HOME"
          "$RUNNER_TEMP/dialectos-hermes-venv/bin/python" -c "from hermes_cli.plugins_cmd_catalog import cmd_validate; cmd_validate('plugins/dialectos-hermes', as_json=True)"

      # The unit tests mock the CLI; this runs validate through the real built CLI.
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Real CLI validate matrix (offline, no provider calls)
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-test-runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          "$RUNNER_TEMP/dialectos-hermes-venv/bin/python" plugins/dialectos-hermes/tests/smoke/markdown_smoke.py "$PYTHONPATH" "$RUNNER_TEMP/dialectos-markdown-profile" packages/cli/dist/cli.js
