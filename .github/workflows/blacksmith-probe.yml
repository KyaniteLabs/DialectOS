# NOTE: intentionally left disabled (disabled_manually). This workflow exists
# solely to probe the paid Blacksmith complementary runner
# (probe_label: complementary-runner-probe), so it cannot be moved to
# ubuntu-latest without losing its purpose. Re-enable only if/when paid
# Blacksmith runners are approved again.
name: Blacksmith Probe

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/blacksmith-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    uses: KyaniteLabs/.github/.github/workflows/blacksmith-probe.yml@0c25ef1cb0e3bed80c53dbcbda28447aa9e7df20 # main
    with:
      probe_label: complementary-runner-probe
