name: Validate Translations

on:
  pull_request:
    paths:
      - '**/*.es.json'
      - '**/*.es-*.json'
      - '**/*-es.md'
      - '**/*-es-*.md'
      - 'locales/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        dialect:
          - es-ES
          - es-MX
          - es-AR
          - es-CO
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a # v6
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Build
        run: pnpm install --frozen-lockfile && pnpm -r build

      - name: Validate ${{ matrix.dialect }}
        run: |
          node scripts/ci-validate.mjs \
            --dialect=${{ matrix.dialect }} \
            --source-dir=. \
            --format=text

      - name: Post validation comment
        if: always()
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            import { readFileSync, existsSync } from 'node:fs';
            const commentPath = 'dialectos-validation-comment.md';
            if (existsSync(commentPath)) {
              const body = readFileSync(commentPath, 'utf-8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
