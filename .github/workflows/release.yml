name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - run: pnpm test:coverage

      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Verify packages install from tarballs
        run: |
          mkdir -p /tmp/dialectos-release-dry-run
          for pkg in packages/*; do
            [ -f "$pkg/package.json" ] || continue
            echo "::group::tarball smoke for $pkg"
            tarball="$(cd "$pkg" && pnpm pack --pack-destination /tmp/dialectos-release-dry-run | tail -n 1)"
            node scripts/tarball-smoke.mjs "$tarball"
            echo "::endgroup::"
          done

      - name: Publish dry-run
        if: ${{ !inputs.publish }}
        run: |
          packages=(
            packages/types
            packages/security
            packages/locale-utils
            packages/markdown-parser
            packages/providers
            packages/cli
            packages/mcp
          )
          for pkg in "${packages[@]}"; do
            echo "::group::pnpm publish --dry-run for $pkg"
            (cd "$pkg" && pnpm publish --dry-run --access public --no-git-checks)
            echo "::endgroup::"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages
        if: ${{ inputs.publish }}
        run: |
          packages=(
            packages/types
            packages/security
            packages/locale-utils
            packages/markdown-parser
            packages/providers
            packages/cli
            packages/mcp
          )
          for pkg in "${packages[@]}"; do
            name="$(node -p "require('./$pkg/package.json').name")"
            version="$(node -p "require('./$pkg/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already exists on npm; skipping"
              continue
            fi
            echo "::group::pnpm publish for $pkg"
            (cd "$pkg" && pnpm publish --access public --no-git-checks)
            echo "::endgroup::"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
