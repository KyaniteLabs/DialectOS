name: dialectos
version: "0.2.2"
manifest_version: 2
description: "Translate into the regional Spanish you mean, from 25 variants (es-MX, es-AR, es-ES and more), and check the result before you send it. When a message asks for Spanish, Hermes adds a short dialect brief. Five tools translate, detect a variant, check a translation against its source, list the variants and offer offline Learn tips and quizzes. /dialectos does the same from chat, and a bundled skill walks the agent through it. A DialectOS page in the desktop app and web dashboard lets you detect, translate and check a pair, and shows the check history per variant (needs Hermes 0.23.0 or later). Disclosure: first use downloads the DialectOS v0.3.2 CLI once from its GitHub Release, checks it against a pinned sha256 and keeps it under plugin-data/dialectos/ (needs Node 22.13+). After that, detect, list and validate run offline. Validate checks form (numbers, language, length, links, placeholders, code blocks, regional terms), not meaning. Translate sends text only to a provider you name (llm, deepl, libre or mymemory), from the agent or when you press Translate on the page. With none named it refuses, and it never falls back to another provider. Provider keys are read only through Hermes secret scope and passed only to the CLI, which gets a cleaned environment. A ledger records verdicts only (tool, variant, pass and issue counts, never text) under plugin-data/dialectos/. Learn adds a private 0600 learning.json in the same folder, containing only concept ids, variant codes, dictionary terms, box numbers and due dates, never source text, translations or answers; damaged files are backed up privately. Learn reads the installed bundled dictionary and never downloads it. Gateway Learn actions are read-only. No telemetry and no background jobs."
author: "Kyanite Labs"
license: Apache-2.0
homepage: https://github.com/KyaniteLabs/DialectOS/tree/main/plugins/dialectos-hermes
tags: [spanish, localization, i18n, dialects, translation, qa]
requires_hermes: ">=0.21.6"
requires_env: []
provides_tools:
  - dialectos_translate
  - dialectos_detect
  - dialectos_validate
  - dialectos_list_dialects
  - dialectos_learn
provides_hooks:
  - pre_llm_call
  - post_tool_call
hooks:
  - pre_llm_call
  - post_tool_call
config_schema:
  dialectos_command:
    type: str
    default: ""
    description: "Empty runs the verified v0.3.2 release kept under plugin-data. Set a command prefix (e.g. 'dialectos' if installed globally from the release tarball) to run your own copy."
  default_dialect:
    type: str
    default: "es-MX"
  provider:
    type: str
    default: ""
    description: "Explicit translation provider required: llm | deepl | libre | mymemory. Missing selection and auto are refused; no automatic fallback."
  inject_on_spanish:
    type: bool
    default: true
    description: "Inject a dialect/QA brief when the user asks for Spanish (not bare localize/i18n for other languages)."
  allow_translate_slash_on_gateway:
    type: bool
    default: false
    description: "When false, /dialectos translate is refused on gateway platforms (it sends text to a network provider)."
  timeout_seconds:
    type: int
    default: 120
