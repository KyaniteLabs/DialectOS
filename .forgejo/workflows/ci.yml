name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: KyaniteLabs/.github/.forgejo/workflows/ci-profile.yml@d99e9be1830d5e29d1d8f0ba1722997d3dd2184f
    with:
      artifact_paths: |
        .ci-results/
        packages/*/.ci-results/
