name: "DialectOS Translation Validation"
description: "Validate Spanish translations against dialect quality checks"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  dialect:
    description: "Spanish dialect code to validate against (e.g., es-ES, es-MX, es-AR)"
    required: true
    default: "es-ES"
  source-dir:
    description: "Directory containing source and translated files"
    required: false
    default: "."
  target-patterns:
    description: "Comma-separated glob patterns for translated files (e.g., '**/*.es.json','**/*-es.md')"
    required: false
    default: ""
  glossary-file:
    description: "Path to JSON glossary file for terminology checks"
    required: false
    default: ""
  fail-on-blocking:
    description: "Fail the action on blocking issues (vs. any issue)"
    required: false
    default: "true"
  format:
    description: "Output format (text or json)"
    required: false
    default: "text"
  strict:
    description: "Treat all issues (not just blocking) as failures"
    required: false
    default: "false"
  locale-base:
    description: "Source-language locale JSON (e.g. locales/en.json) used as the source text for locale files"
    required: false
    default: ""
  allow-empty:
    description: "Pass when target-patterns match no files (default: fail, since an empty match is usually a misconfiguration)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "pnpm"

    - name: Build DialectOS
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile && pnpm -r build

    - name: Validate translations
      shell: bash
      env:
        DIALECTOS_DIALECT: ${{ inputs.dialect }}
        DIALECTOS_SOURCE_DIR: ${{ inputs.source-dir }}
        DIALECTOS_TARGET_PATTERNS: ${{ inputs.target-patterns }}
        DIALECTOS_GLOSSARY_FILE: ${{ inputs.glossary-file }}
        DIALECTOS_LOCALE_BASE: ${{ inputs.locale-base }}
        DIALECTOS_FAIL_ON_BLOCKING: ${{ inputs.fail-on-blocking }}
        DIALECTOS_FORMAT: ${{ inputs.format }}
        DIALECTOS_STRICT: ${{ inputs.strict }}
        DIALECTOS_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        DIALECTOS_ACTION_PATH: ${{ github.action_path }}
      run: |
        node "${{ github.action_path }}/scripts/ci-validate.mjs" \
          --dialect="$DIALECTOS_DIALECT" \
          --source-dir="$DIALECTOS_SOURCE_DIR" \
          --target-patterns="$DIALECTOS_TARGET_PATTERNS" \
          --glossary-file="$DIALECTOS_GLOSSARY_FILE" \
          --locale-base="$DIALECTOS_LOCALE_BASE" \
          --fail-on-blocking="$DIALECTOS_FAIL_ON_BLOCKING" \
          --format="$DIALECTOS_FORMAT" \
          --strict="$DIALECTOS_STRICT" \
          --allow-empty="$DIALECTOS_ALLOW_EMPTY" \
          --cli-path="$DIALECTOS_ACTION_PATH/packages/cli/dist/cli.js"
