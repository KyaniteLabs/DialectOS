packages:
  - 'packages/*'
# Internal @dialectos/* dependencies use real semver ranges (^0.3.0) so packed
# tarballs are installable from any registry. This flag keeps pnpm linking the
# local workspace packages during development instead of hitting the registry.
linkWorkspacePackages: true
allowBuilds:
  esbuild: true
overrides:
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'path-to-regexp@>=8.0.0 <8.4.0': '>=8.4.0'
  'vite@>=7.0.0 <=7.3.1': '>=7.3.2 <8.0.0'
  'vite@>=7.1.0 <=7.3.1': '>=7.3.2 <8.0.0'
  'hono@>=4.0.0 <4.13.11': '4.13.11'
  '@hono/node-server@>=1.0.0 <2.1.3': '2.1.3'
  'follow-redirects@<=1.15.11': '>=1.16.0'
  'dompurify@>=3.0.0 <=3.4.16': '3.4.17'
  'fast-uri@>=3.0.0 <3.1.9': '3.1.9'
  'ip-address@>=10.0.0 <=10.7.3': '10.7.4'
  'axios@>=1.0.0 <1.15.0': '>=1.15.0'
  'qs@>=6.0.0 <=6.16.0': '6.16.1'
  # Pin the existing Vite 7 line: Vitest 4.1.11 newly allows Vite 8.
  vite: '7.3.7'
  'vitest@>=4.0.0 <4.1.12': '4.1.12'
  '@vitest/mocker@>=4.0.0 <4.1.12': '4.1.12'
  'undici@>=7.0.0 <7.30.1': '7.30.1'
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
  'postcss@>=8.0.0 <=8.5.22': '8.5.23'
  'nanoid@>=3.0.0 <3.3.18': '3.3.18'
  'proxy-addr@>=1.1.0 <2.0.8': '2.0.8'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'zod@>=4.0.0 <4.6.6': '4.6.6'
  'esbuild@>=0.27.3 <0.28.1': '0.28.1'
